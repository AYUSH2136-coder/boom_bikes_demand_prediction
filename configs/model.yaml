linear_regression:
  fit_intercept: true

ridge:
  alpha: 1.0

lasso:
  alpha: 0.01

decision_tree:
  max_depth: 6
  min_samples_split: 10
  random_state: 42

random_forest:
  n_estimators: 200
  max_depth: 10
  min_samples_split: 5
  random_state: 42
  n_jobs: -1

xgboost:
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1

lightgbm:
  n_estimators: 300
  learning_rate: 0.05
  max_depth: -1
  num_leaves: 31
  random_state: 42
  n_jobs: -1

catboost:
  iterations: 300
  learning_rate: 0.05
  depth: 6
  random_seed: 42
  verbose: 0

tuning:
  cv: 5
  scoring: neg_root_mean_squared_error
  n_iter: 50
  random_state: 42
