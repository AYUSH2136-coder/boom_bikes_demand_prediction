[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name = "boom-bikes-demand-prediction"
version = "0.1.0"
description = "End-to-end ML pipeline to predict daily bike rental demand for BoomBikes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

authors = [
  { name = "Your Name", email = "you@example.com" },
]

keywords = [
  "machine-learning",
  "regression",
  "bike-sharing",
  "demand-prediction",
  "xgboost",
  "lightgbm",
  "catboost",
  "shap",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Core runtime dependencies ─────────────────────────────────────────────────
dependencies = [
  # Data handling
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "scipy>=1.12,<2.0",

  # Machine learning
  "scikit-learn>=1.4,<2.0",
  "xgboost>=2.0,<3.0",
  "lightgbm>=4.3,<5.0",
  "catboost>=1.2,<2.0",

  # Explainability
  # shap>=0.46 dropped the numba dependency; safe on Python 3.12+
  "shap>=0.46,<1.0",

  # Visualisation
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",

  # Serialisation & config
  "joblib>=1.3,<2.0",
  "pyyaml>=6.0,<7.0",

  # Statistical modelling (for residual diagnostics)
  "statsmodels>=0.14,<1.0",
]

# ── Optional dependency groups ────────────────────────────────────────────────
[project.optional-dependencies]

# Jupyter notebook environment
notebook = [
  "jupyter>=1.1,<2.0",
  "jupyterlab>=4.2,<5.0",
  "ipykernel>=6.29,<7.0",
  "ipywidgets>=8.1,<9.0",
  "nbformat>=5.10,<6.0",
]

# Development tooling
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0",
  "black>=24.0,<25.0",
  "isort>=5.13,<6.0",
  "pre-commit>=3.7,<4.0",
  "mypy>=1.10,<2.0",
  "pandas-stubs>=2.2,<3.0",
]

# All optional groups together
all = [
  "boom-bikes-demand-prediction[notebook,dev]",
]

# ── CLI entry points (add scripts here as they are implemented) ───────────────
[project.scripts]
# boom-train   = "src.training.train:main"
# boom-predict = "src.inference.predict:main"

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["configs/*.yaml", "*.md"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short --cov=src --cov-report=term-missing"
python_files   = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# ── ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
ignore = [
  "E501",  # line too long — handled by black
  "B008",  # do not perform function calls in default args
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "F811"]   # notebooks have top-level imports

# ── black (formatter) ─────────────────────────────────────────────────────────
[tool.black]
target-version = ["py311", "py312", "py313"]
line-length    = 100
skip-magic-trailing-comma = false

# ── isort ─────────────────────────────────────────────────────────────────────
[tool.isort]
profile       = "black"
line_length   = 100
known_first_party = ["src"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true
warn_return_any        = true
warn_unused_configs    = true
exclude                = ["notebooks/", "tests/"]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["src"]
omit     = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under   = 60

# ── uv-specific overrides ─────────────────────────────────────────────────────
# Prevents uv from resolving numba versions that only support Python <3.10.
# numba>=0.57 is the first release to support Python 3.11/3.12.
[tool.uv]
override-dependencies = [
  "numba>=0.59; python_version>='3.12'",
]
constraint-dependencies = [
  # Keep llvmlite (numba's LLVM binding) aligned with supported numba builds
  "llvmlite>=0.42; python_version>='3.12'",
]
